server {
    listen 80;
    server_name mrfinance.freemyip.com;

    # Redirección automática a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mrfinance.freemyip.com;

    ssl_certificate /etc/letsencrypt/live/mrfinance.freemyip.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mrfinance.freemyip.com/privkey.pem;

    # Compilación estática de React (Frontend)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Redirección de peticiones de API al backend
    # El '/' al final de proxy_pass actúa como el rewrite de Vite, eliminando '/api/' de la petición
    location /api/ {
        proxy_pass http://app:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


